<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Unlock - Error Code Guide</title>
    <style>
        :root {
            --primary: #FF6900;
            --primary-glow: rgba(255, 105, 0, 0.2);
            --bg-dark: #0f111a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: radial-gradient(circle at top right, #1a1c2c, #0f111a);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 50px;
        }

        #errors-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Premium Accordion Styling */
        .accordion {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            cursor: pointer;
            padding: 20px 25px;
            width: 100%;
            text-align: left;
            outline: none;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .accordion:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-2px);
        }

        .accordion.active {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            border-color: var(--primary);
            background: rgba(255, 105, 0, 0.05);
        }

        .accordion:after {
            content: '\2193'; /* Down Arrow */
            color: var(--primary);
            transition: transform 0.3s ease;
        }

        .accordion.active:after {
            transform: rotate(180deg);
        }

        /* Panel Styling */
        /* Panel Styling Update */
.panel {
    background: rgba(20, 22, 32, 0.5);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-top: none;
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
    height: 0; /* max-height ki jagah height */
    overflow: hidden;
    transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1); /* Smoother curve */
    padding: 0 25px;
    opacity: 0;
}

.panel.show {
    opacity: 1;
    padding: 10px 25px 30px 25px; /* Thoda padding adjust kiya */
}


        .section-box {
            margin-top: 15px;
        }

        .panel h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 8px;
            opacity: 0.8;
        }

        .content-text {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ccd0d9;
            border-left: 3px solid var(--primary);
        }

        ul {
            margin: 0;
            padding-left: 20px;
        }

        li {
            margin-bottom: 5px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
        
        
        
        
        /* Navigation Bar & Back Button */
.nav-header {
    max-width: 900px;
    margin: 0 auto 20px auto;
    display: flex;
    align-items: center;
}

.back-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
    text-decoration: none;
    backdrop-filter: blur(10px);
}

.back-btn:hover {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    box-shadow: 0 0 15px var(--primary-glow);
    transform: translateX(-5px); /* Chhota sa slide effect */
}

.back-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
}




.social-link {
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.social-link:hover {
    transform: scale(1.2);
}

.social-link:active {
    transform: scale(0.9);
}

    </style>
</head>
<body>
<div class="nav-header">
    <a href="javascript:history.back()" class="back-btn">
        <svg viewBox="0 0 24 24"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"></path></svg>
        Back to Settings
    </a>
</div>



    <h1>Mi Unlock Error <span style="font-weight: 300;">Codes</span></h1>
    <div id="errors-container">
        </div>
<div class="settings-footer" style="margin-top: 50px; padding-bottom: 40px; text-align: center;">
    
    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 30px auto; width: 85%;">

    <p style="font-size: 11px; color: var(--text-dim); margin-bottom: 20px; letter-spacing: 3px; font-weight: 600;">FOLLOW US</p>

    <div style="display: flex; gap: 25px; justify-content: center; align-items: center;">
        <a href="https://t.me/+rwHkuKp_cQFlZDll" target="_blank" class="social-link">
          <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram" style="width: 32px; height: 32px; filter: drop-shadow(0 0 5px rgba(0,136,204,0.4));">
        </a>
        <a href="https://youtube.com/@helproot" target="_blank" class="social-link">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YouTube" style="width: 35px; height: 35px; filter: drop-shadow(0 0 5px rgba(255,0,0,0.3));">
        </a>
    </div>

    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 30px auto; width: 85%;">
    
    <p style="font-size: 10px; color: var(--text-dim); opacity: 0.4;">© 2026 Mi Unlock Tool Helper By- @HelpRoot</p>
</div>

    <script>
        function createSection(title, content) {
            if (!content) return null;
            
            const section = document.createElement('div');
            section.className = 'section-box';
            
            const h3 = document.createElement('h3');
            h3.textContent = title;
            
            const div = document.createElement('div');
            div.className = 'content-text';

            if (content.includes('\n')) {
                const list = document.createElement('ul');
                content.split('\n').filter(t => t.trim()).forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    list.appendChild(li);
                });
                div.appendChild(list);
            } else {
                div.textContent = content;
            }

            section.appendChild(h3);
            section.appendChild(div);
            return section;
        }

        fetch('code.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('errors-container');
                data.forEach(error => {
                    const btn = document.createElement('button');
                    btn.className = 'accordion';
                    btn.innerHTML = `<span>Error Code: <b style="color:var(--primary)">${error.errorCode}</b></span>`;
                    
                    const panel = document.createElement('div');
                    panel.className = 'panel';

                    panel.appendChild(createSection('Message', error.message));
                    panel.appendChild(createSection('Technical Description', error.description));
                    panel.appendChild(createSection('Recommended Solution', error.solution));
                    
                    container.appendChild(btn);
                    container.appendChild(panel);

                    btn.addEventListener('click', function() {
    this.classList.toggle('active');
    const pnl = this.nextElementSibling;

    if (pnl.style.height && pnl.style.height !== "0px") {
        // Band karne ke liye
        pnl.style.height = "0px";
        pnl.classList.remove('show');
    } else {
        // Kholne ke liye exact height set karein
        pnl.classList.add('show');
        // scrollHeight poore content ki asli height batata hai
        pnl.style.height = pnl.scrollHeight + "px"; 
    }
});
              });
            })
            .catch(err => {
                document.getElementById('errors-container').innerHTML = `<p style="text-align:center; color:red;">Failed to load JSON data. Make sure 'code.json' is in the same folder.</p>`;
            });
    </script>
</body>
</html>
